name: Build Salad image

# Builds the FaceFusion container and pushes it to GHCR whenever the
# salad/ directory changes. SaladCloud then pulls this image, so you never
# build Docker locally. After the first successful build, flip the GHCR
# package visibility to Public (one click) so Salad can pull it without creds.
on:
  push:
    branches: [main]
    paths: ["salad/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: salad
          push: true
          tags: ghcr.io/divyanshmusicc/faceswap-salad:latest
